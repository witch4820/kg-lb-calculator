<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kg ↔ 파운드(lb) 변환 계산기</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7f8;color:#222}
.card{max-width:520px;margin:30px auto;background:#fff;border:1px solid #e5e5e5;border-radius:20px;padding:24px}
h1{font-size:22px;margin:0 0 8px}
p{color:#666;font-size:14px}
label{display:block;font-weight:700;margin:18px 0 7px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:20px}
input:focus{outline:2px solid #ddd}
.result{margin-top:20px;padding:18px;border-radius:14px;background:#f3f3f3;text-align:center;font-size:22px;font-weight:700}
.small{font-size:12px;color:#777;text-align:center;margin-top:8px}
button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;background:#222;color:#fff;font-size:15px}
</style>
</head>
<body>
<div class="card">
<h1>⚖️ kg ↔ 파운드(lb) 변환 계산기</h1>
<p>kg 또는 lb에 숫자를 입력하면 반대 단위가 자동으로 계산됩니다.</p>

<label for="kg">킬로그램 (kg)</label>
<input id="kg" type="number" min="0" step="any" inputmode="decimal" placeholder="예: 60">

<label for="lb">파운드 (lb)</label>
<input id="lb" type="number" min="0" step="any" inputmode="decimal" placeholder="예: 132.28">

<div class="result" id="result">숫자를 입력해 주세요</div>
<div class="small">1 kg = 2.2046226218 lb</div>
<button type="button" id="clear">초기화</button>
</div>

<script>
const kg=document.getElementById("kg");
const lb=document.getElementById("lb");
const result=document.getElementById("result");
const factor=2.2046226218;
const fmt=n=>Number(n.toFixed(5)).toLocaleString("ko-KR",{maximumFractionDigits:5});

kg.addEventListener("input",()=>{
  if(kg.value===""){lb.value="";result.textContent="숫자를 입력해 주세요";return}
  const n=Number(kg.value);
  if(!Number.isFinite(n)||n<0)return;
  const v=n*factor;
  lb.value=Number(v.toFixed(5));
  result.textContent=`${fmt(n)} kg = ${fmt(v)} lb`;
});

lb.addEventListener("input",()=>{
  if(lb.value===""){kg.value="";result.textContent="숫자를 입력해 주세요";return}
  const n=Number(lb.value);
  if(!Number.isFinite(n)||n<0)return;
  const v=n/factor;
  kg.value=Number(v.toFixed(5));
  result.textContent=`${fmt(v)} kg = ${fmt(n)} lb`;
});

document.getElementById("clear").addEventListener("click",()=>{
  kg.value="";lb.value="";result.textContent="숫자를 입력해 주세요";kg.focus();
});
</script>
</body>
</html>
